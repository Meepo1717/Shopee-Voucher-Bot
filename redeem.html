<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redeem your vouchers</title>
  <style>
    body {
      font-family: 'Google Sans', sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }

    .container {
      width: 400px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      background: #fff;
      text-align: center;
    }

    h1 {
      color: #ff5722; /* Shopee orange */
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    button.copy-btn {
      margin-left: 8px;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background-color: #ff5722;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button.copy-btn:hover {
      background-color: #e64a19;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Redeem your vouchers</h1>

    <!-- Phone Number -->
    <div class="input-group">
      <input type="text" id="phoneNumber" placeholder="Phone Number" value="+60123456789" readonly>
      <button class="copy-btn" onclick="copyToClipboard('phoneNumber')">Copy</button>
    </div>

    <!-- OTP -->
    <div class="input-group">
      <input type="text" id="otpCode" placeholder="OTP Code" value="123456" readonly>
      <button class="copy-btn" onclick="copyToClipboard('otpCode')">Copy</button>
    </div>
  </div>

  <script>
    function copyToClipboard(elementId) {
      const copyText = document.getElementById(elementId);
      copyText.select();
      copyText.setSelectionRange(0, 99999); // For mobile
      navigator.clipboard.writeText(copyText.value)
        .then(() => alert("Copied: " + copyText.value))
        .catch(err => console.error("Error copying text: ", err));
    }
  </script>
</body>
</html>
