<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voucher Redemption</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Google Sans', sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    header {
      width: 100%;
      background-color: #ff5722;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }

    header img {
      height: 40px;
    }

    .lang-switch {
      display: flex;
      gap: 8px;
    }

    .lang-switch button {
      padding: 8px 14px;
      background: white;
      color: #ff5722;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .lang-switch button:hover {
      background: #ffe6e0;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      color: #ff5722;
      font-size: 1.6rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-group input {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .copy-btn {
      padding: 10px 14px;
      background: #ff5722;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      transition: 0.2s;
    }

    .copy-btn:hover {
      background: #e64a19;
    }

    .voucher-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #ff5722;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: 0.2s;
    }

    .voucher-btn:hover {
      background: #e64a19;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.3rem;
      }
      .copy-btn {
        padding: 8px 12px;
        font-size: 0.85rem;
      }
      .input-group input {
        font-size: 0.95rem;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo">
    <div class="lang-switch">
      <button onclick="setLanguage('en')">EN</button>
      <button onclick="setLanguage('bm')">BM</button>
    </div>
  </header>

  <main>
    <h1 id="title">Voucher Redemption</h1>
    <div class="form-container">
      <div class="input-group">
        <input type="text" id="phoneNumber" value="+60123456789" readonly>
        <button class="copy-btn" onclick="copyToClipboard('phoneNumber')">Copy</button>
      </div>
      <div class="input-group">
        <input type="text" id="otpCode" value="123456" readonly>
        <button class="copy-btn" onclick="copyToClipboard('otpCode')">Copy</button>
      </div>
    </div>
    <button class="voucher-btn" onclick="redeem()">Redeem Voucher</button>
  </main>

  <script>
    const translations = {
      en: {
        title: "Voucher Redemption",
        redeem: "Redeem Voucher"
      },
      bm: {
        title: "Penebusan Baucar",
        redeem: "Tebus Baucar"
      }
    };

    function setLanguage(lang) {
      document.getElementById("title").innerText = translations[lang].title;
      document.querySelector(".voucher-btn").innerText = translations[lang].redeem;
    }

    function copyToClipboard(id) {
      const input = document.getElementById(id);
      navigator.clipboard.writeText(input.value);
      // removed alert popup
    }

    function redeem() {
      alert("Voucher redeemed successfully!"); 
      // replace this with backend redeem API call later
    }
  </script>
</body>
</html>
