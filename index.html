<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HavicBot Voucher Redemption</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Language Switcher -->
    <div class="absolute top-4 right-4">
        <button id="lang-switcher" class="px-4 py-2 bg-white text-gray-700 font-semibold rounded-lg shadow-md hover:bg-gray-200 transition-colors duration-200">
            Bahasa Melayu
        </button>
    </div>

    <!-- Card -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center">
            <h1 class="text-3xl font-bold mb-2" data-translate="title" style="color: #EE4D2D;">Voucher Redemption</h1>
            <p class="text-gray-500 mb-6" data-translate="subtitle">Enter your details to begin.</p>
        </div>

        <form id="verifyForm">
            <div class="mb-4">
                <label for="shopeeId" class="block mb-2 text-sm font-medium text-gray-700" data-translate="shopee_id_label">Shopee Order ID</label>
                <input type="text" id="shopeeId" name="shopeeId" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-orange-500 focus:border-orange-500 block w-full p-3" placeholder="e.g., 230605TYUQG5Y6" required>
            </div>

            <button type="submit" id="submitButton" class="text-white bg-[#EE4D2D] hover:bg-[#d73410] focus:ring-4 focus:outline-none focus:ring-orange-300 font-medium rounded-lg text-sm w-full px-5 py-3 text-center">
                Verify Order
            </button>
        </form>
        
        <div id="responseMessage" class="mt-6 text-center text-sm font-medium p-4 rounded-lg hidden" aria-live="polite"></div>
    </div>

    <script>
        const verifyForm = document.getElementById('verifyForm');
        const responseMessage = document.getElementById('responseMessage');
        const submitButton = document.getElementById('submitButton');
        const backendUrl = "https://havicbot-backend.onrender.com";

        function showError(msg) {
            responseMessage.textContent = msg;
            responseMessage.className = "mt-6 text-center text-sm font-medium p-4 rounded-lg bg-red-100 text-red-800";
            responseMessage.classList.remove("hidden");
            submitButton.disabled = false;
            submitButton.textContent = "Verify Order";
        }

        verifyForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const shopeeId = document.getElementById('shopeeId').value.trim();

            if (!shopeeId) {
                showError("Please enter Order ID.");
                return;
            }

            submitButton.textContent = "Verifying...";
            submitButton.disabled = true;
            responseMessage.classList.add("hidden");

            try {
                // Step 1: Verify order
                const verifyResponse = await fetch(`${backendUrl}/verify-order`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ shopeeId })
                });
                const verifyResult = await verifyResponse.json();

                if (!verifyResponse.ok || !verifyResult.success) {
                    showError(verifyResult.message || "Order verification failed.");
                    return;
                }

                // Step 2: Fetch order details
                const detailsResponse = await fetch(`${backendUrl}/get-order-details`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ shopeeId })
                });
                const detailsResult = await detailsResponse.json();

                if (!detailsResponse.ok || !detailsResult.success) {
                    showError(detailsResult.message || "Failed to fetch order details.");
                    return;
                }

                // Step 3: Redirect to otp.html with details
                const query = new URLSearchParams({
                    orderId: shopeeId,
                    items: JSON.stringify(detailsResult.items)
                }).toString();

                window.location.href = `otp.html?${query}`;
            } catch (error) {
                console.error("Error verifying order:", error);
                showError("Something went wrong. Please try again.");
            }
        });
    </script>

</body>
</html>
