<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HavicBot</title>

    <!-- Google Sans Font -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Google Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #333;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
            background-color: #ff5722; /* Shopee orange */
        }
        header img {
            height: 50px;
        }
        header button {
            background-color: #fff;
            color: #ff5722;
            border: none;
            padding: 8px 12px;
            margin-left: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Google Sans', sans-serif;
            font-weight: 500;
        }
        header button:hover {
            background-color: #ffe0d6;
        }
    </style>
</head>
<body>

    <header>
        <!-- Logo that you can change anytime by replacing logo.png in GitHub -->
        <img src="logo.png" alt="HavicBot Logo">
        
        <div>
            <button onclick="setLanguage('en')">EN</button>
            <button onclick="setLanguage('bm')">BM</button>
        </div>
    </header>

    <main style="padding: 20px;">
        <h1 id="title">Welcome to HavicBot</h1>
        <p id="description">Automated Shopee voucher bot system.</p>
    </main>

    <script>
        const translations = {
            en: {
                title: "Welcome to HavicBot",
                description: "Automated Shopee voucher bot system."
            },
            bm: {
                title: "Selamat Datang ke HavicBot",
                description: "Sistem bot baucar Shopee automatik."
            }
        };

        function setLanguage(lang) {
            document.getElementById('title').textContent = translations[lang].title;
            document.getElementById('description').textContent = translations[lang].description;
        }
    </script>

</body>
</html>
