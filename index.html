<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redeem your vouchers</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Google Sans', sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    header {
      width: 100%;
      background-color: #ff5722; /* Shopee orange */
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }

    header img {
      height: 40px;
    }

    .lang-switch {
      display: flex;
      gap: 8px;
    }

    .lang-switch button {
      padding: 8px 14px;
      background: white;
      color: #ff5722;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .lang-switch button:hover {
      background: #ffe6e0;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      color: #ff5722;
      font-size: 1.6rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button.redeem {
      width: 100%;
      padding: 12px;
      background-color: #ff5722;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    button.redeem:hover {
      background-color: #e64a19;
    }

    .purchase-btn {
      margin-top: 16px;
      text-align: center;
    }

    .purchase-btn a {
      display: inline-block;
      background-color: #ff5722;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .purchase-btn a:hover {
      background-color: #e64a19;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.3rem;
      }
      input[type="text"], button.redeem {
        font-size: 0.95rem;
        padding: 10px;
      }
      .lang-switch button {
        padding: 6px 10px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo">
    <div class="lang-switch">
      <button onclick="setLanguage('en')">EN</button>
      <button onclick="setLanguage('bm')">BM</button>
    </div>
  </header>

  <main>
    <h1 id="title">Redeem your vouchers</h1>
    <div class="form-container">
      <input type="text" id="orderId" placeholder="Enter Shopee Order ID" />
      <button class="redeem" onclick="redeemVoucher()">Proceed to Redeem</button>
    </div>
    <div class="purchase-btn">
      <a href="https://shopee.com.my/shop/111783206" target="_blank">Purchase New Voucher</a>
    </div>
  </main>

  <script>
    const translations = {
      en: {
        title: "Redeem your vouchers",
        placeholder: "Enter Shopee Order ID",
        redeem: "Proceed to Redeem",
        purchase: "Purchase New Voucher"
      },
      bm: {
        title: "Tebus baucar anda",
        placeholder: "Masukkan ID Pesanan Shopee",
        redeem: "Teruskan untuk Tebus",
        purchase: "Beli Baucar Baru"
      }
    };

    function setLanguage(lang) {
      document.getElementById("title").innerText = translations[lang].title;
      document.getElementById("orderId").placeholder = translations[lang].placeholder;
      document.querySelector(".redeem").innerText = translations[lang].redeem;
      document.querySelector(".purchase-btn a").innerText = translations[lang].purchase;
    }

    function redeemVoucher() {
      window.location.href = "redeem.html";
    }
  </script>
</body>
</html>
