<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Shopee Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-gray-800">Shopee Order Verification</h1>
            <p class="text-gray-500 mt-2">Please enter your Shopee Order SN to retrieve details.</p>
        </div>
        
        <form id="verify-form" class="mt-8 space-y-6">
            <div>
                <label for="order_sn" class="block text-sm font-medium text-gray-700">Order SN (Order ID)</label>
                <input type="text" id="order_sn" name="order_sn" required
                    class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                    placeholder="e.g., 240101ABCD1234">
            </div>

            <div>
                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-200">
                    Verify Order
                </button>
            </div>
        </form>

        <div id="message-area" class="mt-4 text-center text-sm"></div>
    </div>

    <script>
        const form = document.getElementById('verify-form');
        const messageArea = document.getElementById('message-area');
        const orderSnInput = document.getElementById('order_sn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const orderSn = orderSnInput.value.trim();

            if (!orderSn) {
                messageArea.innerHTML = `<p class="text-red-500">Please enter an Order SN.</p>`;
                return;
            }

            // --- Show loading state ---
            messageArea.innerHTML = `<p class="text-blue-500">Verifying order, please wait...</p>`;

            try {
                // --- Communicate with your LIVE backend server on Render ---
                const serverUrl = 'https://shopee-order-verification.onrender.com'; 

                const response = await fetch(`${serverUrl}/verify-order`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ order_sn: orderSn }),
                });

                const result = await response.json();

                if (result.success) {
                    messageArea.innerHTML = `<p class="text-green-500">Success! Redirecting...</p>`;
                    // Store the successful response data in sessionStorage to pass it to the next page
                    sessionStorage.setItem('shopeeOrderDetails', JSON.stringify(result.data));
                    // Redirect to the details page
                    window.location.href = 'order-details.html';
                } else {
                    // Show error message from the server
                    messageArea.innerHTML = `<p class="text-red-500 font-semibold">${result.message || 'Verification failed.'}</p>`;
                }
            } catch (error) {
                console.error('Error:', error);
                messageArea.innerHTML = `<p class="text-red-500 font-semibold">An error occurred. Check the console or if the server is running.</p>`;
            }
        });
    </script>
</body>
</html>
