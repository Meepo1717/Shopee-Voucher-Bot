<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify Order - HavicBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-lg bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-2xl font-bold mb-4" style="color:#EE4D2D;">Order Verification</h1>

    <label class="block text-sm font-medium text-gray-700 mb-2">Enter Order SN</label>
    <input id="order-sn" class="w-full border rounded-lg px-3 py-3 outline-none focus:ring-2 focus:ring-blue-500"
           placeholder="e.g. 250903HV1WVBFA"/>

    <button id="verify-btn"
            class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
      Verify & Continue
    </button>

    <div id="note" class="text-xs text-gray-500 mt-3">
      We’ll only proceed if the order is **paid**. Unpaid orders are blocked for your protection.
    </div>

    <div id="status" class="mt-4 hidden"></div>
  </div>

  <script>
  (function(){
    var backendUrl = "https://havicbot-backend.onrender.com";

    function showStatus(msg, type){
      var el = document.getElementById('status');
      el.className = "mt-4 px-3 py-3 rounded-lg " + (type==='ok'
        ? "bg-green-50 text-green-700 border border-green-200"
        : type==='warn'
          ? "bg-yellow-50 text-yellow-700 border border-yellow-200"
          : "bg-red-50 text-red-700 border border-red-200");
      el.innerHTML = msg;
      el.classList.remove('hidden');
    }

    function disable(btn, on){
      btn.disabled = on;
      if(on){ btn.classList.add('opacity-60','cursor-not-allowed'); }
      else  { btn.classList.remove('opacity-60','cursor-not-allowed'); }
    }

    function isPaidFromPayload(data){
      try{
        // 1) explicit boolean your backend could return
        if (data.is_paid === true) return true;

        // 2) common order status values that imply buyer has paid / order in fulfillment
        var st = (data.order_status || data.status || '').toUpperCase();
        if (['READY_TO_SHIP','TO_SHIP','SHIPPED','COMPLETED','PROCESSED'].indexOf(st) > -1) return true;

        // 3) escrow held > 0 (from your Shopee log -> response.order_income.escrow_amount)
        if (data.order_income && Number(data.order_income.escrow_amount) > 0) return true;

        // 4) otherwise treat as unpaid
        return false;
      }catch(e){ return false; }
    }

    async function verifyOrder(orderSn){
      // Call your existing endpoint. It should work for both paid/unpaid.
      const res = await fetch(backendUrl + "/get-order-details", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ shopeeId: orderSn })
      });

      let payload = {};
      try { payload = await res.json(); } catch(_) {}

      // If backend signals an error (e.g., invalid SN), surface it
      if (!res.ok || payload.success === false) {
        const msg = (payload && payload.message) ? payload.message : ("HTTP " + res.status);
        throw new Error(msg);
      }

      // Some backends wrap the Shopee response; keep both surfaces usable
      // - payload.items/payload.order_sn (your previous format)
      // - payload.response.* (raw Shopee, like the log you pasted)
      const sho = payload.response || {};
      if (!payload.order_income && sho.order_income) payload.order_income = sho.order_income;
      if (!payload.order_status && sho.order_status) payload.order_status = sho.order_status;

      return payload;
    }

    document.getElementById('verify-btn').addEventListener('click', async function(){
      var btn = this;
      var orderSn = (document.getElementById('order-sn').value || '').trim();
      if(!orderSn){ showStatus("Please enter an Order SN.", "err"); return; }

      disable(btn, true);
      showStatus("Verifying order…", "warn");

      try{
        const data = await verifyOrder(orderSn);

        if (!isPaidFromPayload(data)) {
          showStatus("❌ This order appears to be <b>UNPAID</b>. Please complete payment in Shopee first, then return to continue.", "err");
          disable(btn, false);
          return;
        }

        showStatus("✅ Order verified. Redirecting to redemption…", "ok");

        // Use order_sn from backend if present; fall back to the user input
        var sn = data.order_sn || orderSn;
        // Send the SN in the query for otp.html to use:
        window.location.href = "otp.html?order_sn=" + encodeURIComponent(sn);
      }catch(e){
        showStatus("Could not verify the order (" + (e && e.message ? e.message : "unknown error") + ").", "err");
        disable(btn, false);
      }
    });
  })();
  </script>
</body>
</html>
