<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Your OTP - HavicBot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- NEW: Styles for pouring sand animation -->
    <style>
        .sand-top {
            animation: shrink 2s infinite linear;
            transform-origin: bottom;
        }
        .sand-bottom {
            animation: grow 2s infinite linear;
            transform-origin: top;
            transform: scaleY(0); /* Start empty */
        }
        .sand-stream {
            animation: stream 2s infinite linear;
            opacity: 0;
        }
        @keyframes shrink {
            0% { transform: scaleY(1); }
            90% { transform: scaleY(0); }
            100% { transform: scaleY(0); }
        }
        @keyframes grow {
            0% { transform: scaleY(0); }
            10% { transform: scaleY(0); }
            100% { transform: scaleY(1); }
        }
        @keyframes stream {
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Language Switcher Button -->
    <div class="absolute top-4 right-4">
        <button id="lang-switcher" class="px-4 py-2 bg-white text-gray-700 font-semibold rounded-lg shadow-md hover:bg-gray-200 transition-colors duration-200">
            Bahasa Melayu
        </button>
    </div>

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 text-center">
        <h1 class="text-3xl font-bold mb-2" data-translate="title" style="color: #EE4D2D;">Voucher Redemption</h1>
        <p class="text-blue-600 mb-6" id="status-text" data-translate="status_requesting">Requesting a phone number for you...</p>

        <!-- Display Boxes -->
        <div class="mb-4 text-left">
            <label class="block text-sm font-medium text-gray-700" data-translate="order_id_label">Your Order ID</label>
            <div id="order-id-box" class="mt-1 text-lg font-semibold bg-gray-100 p-3 h-12 flex items-center justify-center rounded-lg text-gray-800 text-center"></div>
        </div>
        <div class="mb-4 text-left">
            <label class="block text-sm font-medium text-gray-700" data-translate="phone_label">Generated Phone Number</label>
            <div class="flex items-center gap-2 mt-1">
                <div id="phone-number-box" class="flex-grow text-lg font-semibold bg-gray-100 p-3 h-12 flex items-center justify-center rounded-lg text-gray-800 text-center">
                    <!-- NEW: Pouring Sand Hourglass SVG -->
                    <svg id="phone-hourglass" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" class="text-gray-400">
                        <path d="M5 22h14 M5 2h14 M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22 M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <g>
                            <path d="M9 7h6L12 11.5z" fill="currentColor" class="sand-top"/>
                            <path d="M9 17h6L12 12.5z" fill="currentColor" class="sand-bottom"/>
                            <line x1="12" y1="11.5" x2="12" y2="12.5" stroke="currentColor" stroke-width="1.5" class="sand-stream"/>
                        </g>
                    </svg>
                </div>
                <button id="copy-phone-btn" class="p-3 bg-gray-200 hover:bg-gray-300 rounded-lg transition-colors hidden" data-translate-title="copy_button_title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
            </div>
        </div>
        <div class="mb-2 text-left">
            <label class="block text-sm font-medium text-gray-700" data-translate="otp_label">Verification Code (OTP)</label>
            <div class="flex items-center gap-2 mt-1">
                <div id="otp-box" class="flex-grow text-lg font-semibold bg-gray-100 p-3 h-12 flex items-center justify-center rounded-lg text-blue-600 text-center">
                    <!-- NEW: Pouring Sand Hourglass SVG -->
                    <svg id="otp-hourglass" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" class="text-gray-400">
                        <path d="M5 22h14 M5 2h14 M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22 M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <g>
                            <path d="M9 7h6L12 11.5z" fill="currentColor" class="sand-top"/>
                            <path d="M9 17h6L12 12.5z" fill="currentColor" class="sand-bottom"/>
                            <line x1="12" y1="11.5" x2="12" y2="12.5" stroke="currentColor" stroke-width="1.5" class="sand-stream"/>
                        </g>
                    </svg>
                </div>
                <button id="copy-otp-btn" class="p-3 bg-gray-200 hover:bg-gray-300 rounded-lg transition-colors hidden" data-translate-title="copy_button_title">
                     <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
            </div>
        </div>

        <!-- Countdown Timer Display -->
        <div id="timer-container" class="mt-2 text-sm text-gray-500 hidden">
            <p><span data-translate="timer_prefix">Time remaining:</span> <span id="timer"></span></p>
        </div>

        <p class="text-xs text-gray-500 my-6" data-translate="otp_instructions">
            Your code is being generated. Please stay on this page to ensure delivery. This usually takes 2-10 minutes.
        </p>

        <div id="error-message" class="mt-6 text-center text-sm font-medium p-4 rounded-lg bg-red-100 text-red-800 hidden"></div>
        
        <div id="fallback-section" class="mt-4 hidden">
            <button id="fallback-btn" class="text-white bg-orange-500 hover:bg-orange-600 font-medium rounded-lg text-sm w-full px-5 py-3 text-center" data-translate="fallback_button">
                Generate New Number
            </button>
        </div>

        <div class="mt-4">
            <button id="back-btn" class="text-sm text-gray-600 hover:text-gray-800 hover:underline" data-translate="back_button">
                &larr; Go Back
            </button>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="success-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden">
        <!-- ... (modal content remains the same) ... -->
    </div>

    <script>
        // --- Element References ---
        const statusText = document.getElementById('status-text');
        const phoneNumberBox = document.getElementById('phone-number-box');
        const otpBox = document.getElementById('otp-box');
        const phoneHourglass = document.getElementById('phone-hourglass');
        const otpHourglass = document.getElementById('otp-hourglass');
        const timerContainer = document.getElementById('timer-container');
        const timerDisplay = document.getElementById('timer');
        const orderIdBox = document.getElementById('order-id-box');
        const copyPhoneBtn = document.getElementById('copy-phone-btn');
        const copyOtpBtn = document.getElementById('copy-otp-btn');
        // ... (other element references)

        // --- Translations ---
        const translations = {
            en: {
                // ... (all previous translations)
                timer_prefix: 'Time remaining:'
            },
            ms: {
                // ... (all previous translations)
                timer_prefix: 'Masa tinggal:'
            }
        };
        
        // --- State Variables ---
        let otpCheckInterval;
        let countdownInterval;
        // ... (other state variables)

        // --- Functions ---
        // ... (setLanguage, T, copyToClipboard, getQueryParam remain the same)

        function startCountdown(duration) {
            let timer = duration;
            timerContainer.classList.remove('hidden');

            countdownInterval = setInterval(() => {
                let minutes = parseInt(timer / 60, 10);
                let seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                timerDisplay.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(countdownInterval);
                }
            }, 1000);
        }

        // --- Main Logic ---
        const backendUrl = 'https://havicbot-backend.onrender.com';

        async function getPhoneNumber(isFallback = false) {
            // ... (this function remains mostly the same)
            try {
                // ...
                phoneHourglass.style.display = 'none'; // Hide hourglass
                phoneNumberBox.textContent = result.phoneNumber;
                // ...
                checkForOtp(result.provider, result.providerOrderId);
            } catch (error) {
                // ...
                phoneHourglass.style.display = 'none';
                otpHourglass.style.display = 'none';
            }
        }

        async function checkForOtp(provider, providerOrderId) {
            if (otpCheckInterval) clearInterval(otpCheckInterval);
            if (countdownInterval) clearInterval(countdownInterval); // Clear previous countdown
            
            startCountdown(300); // Start the 5-minute (300 seconds) timer
            
            let lastOtp = null;
            // ... (rest of the function)

            otpCheckInterval = setInterval(async () => {
                try {
                    // ...
                    if (otpResponse.ok && otpResult.otp && otpResult.otp !== lastOtp) {
                        lastOtp = otpResult.otp;
                        otpHourglass.style.display = 'none'; // Hide hourglass
                        otpBox.textContent = otpResult.otp;
                        // ...
                        clearInterval(countdownInterval); // Stop countdown on success
                        clearInterval(otpCheckInterval); 
                    }
                } catch (error) { console.error("Error checking for OTP:", error); }
            }, 5000);

            setTimeout(() => {
                if (!lastOtp) {
                    clearInterval(otpCheckInterval);
                    clearInterval(countdownInterval);
                    timerContainer.classList.add('hidden');
                    // ... (rest of the timeout logic)
                }
            }, 300000); 
        }
        
        // --- Event Listeners ---
        // ... (event listeners remain the same)

        window.onload = () => {
            const orderId = getQueryParam('orderId');
            orderIdBox.textContent = orderId;
            setLanguage('en');
            getPhoneNumber();
        };
    </script>

</body>
</html>
