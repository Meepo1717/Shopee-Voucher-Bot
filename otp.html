<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voucher Redemption - HavicBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div id="main" class="w-full max-w-2xl bg-white rounded-xl shadow-lg p-8 text-center">
    <h1 class="text-2xl font-bold mb-6" style="color:#EE4D2D;">Voucher Redemption</h1>
    <div id="loading" class="text-blue-600 font-medium">Fetching your order details...</div>
    <div id="content" class="hidden">
      <div id="orderItems" class="space-y-6"></div>
    </div>
  </div>

  <script>
    const orderSn = new URLSearchParams(window.location.search).get('order_sn');
    const API_BASE = window.location.origin.replace(/\/$/, "");

    if (!orderSn) {
      document.getElementById("loading").textContent = "Invalid order.";
    } else {
      fetchOrderDetails();
    }

    async function fetchOrderDetails() {
      try {
        const res = await fetch(`${API_BASE}/get-order-details`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ shopeeId: orderSn })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message || "Failed");

        document.getElementById("loading").classList.add("hidden");
        document.getElementById("content").classList.remove("hidden");
        renderItems(data.items);
      } catch (e) {
        document.getElementById("loading").textContent = "Failed to load order details.";
        console.error(e);
      }
    }

    function renderItems(items) {
      const container = document.getElementById("orderItems");
      container.innerHTML = "";

      items.forEach((item, idx) => {
        const box = document.createElement("div");
        box.className = "border rounded-xl p-4 shadow";

        box.innerHTML = `
          <h2 class="font-semibold text-lg mb-2">${item.name}</h2>
          <div class="flex flex-col space-y-2">
            <button class="generate-btn px-4 py-2 bg-orange-500 text-white rounded-lg" data-idx="${idx}">
              Generate Number
            </button>
            <div class="phone-box hidden">
              <div class="flex items-center justify-between border rounded-lg px-3 py-2">
                <span class="phone-number text-gray-800 font-mono"></span>
                <button class="copy-btn text-blue-600 text-sm">Copy</button>
              </div>
              <div class="mt-2 flex space-x-2">
                <button class="change-btn px-3 py-1 bg-gray-300 rounded-lg text-sm" disabled>Change Number</button>
                <button class="request-otp-btn px-3 py-1 bg-indigo-500 text-white rounded-lg text-sm hidden">Request Another OTP</button>
              </div>
              <div class="mt-3 border rounded-lg p-3 text-left">
                <div class="otp-code font-mono text-xl text-gray-800">Waiting for OTP...</div>
                <div class="timer text-sm text-gray-500"></div>
              </div>
            </div>
          </div>
        `;

        container.appendChild(box);
        setupItem(box, idx, item.name);
      });
    }

    function setupItem(box, idx, productName) {
      const genBtn = box.querySelector(".generate-btn");
      const phoneBox = box.querySelector(".phone-box");
      const phoneNumberSpan = box.querySelector(".phone-number");
      const copyBtn = box.querySelector(".copy-btn");
      const changeBtn = box.querySelector(".change-btn");
      const requestOtpBtn = box.querySelector(".request-otp-btn");
      const otpCode = box.querySelector(".otp-code");
      const timerEl = box.querySelector(".timer");

      let provider = null;
      let providerOrderId = null;
      let countdownInterval;

      genBtn.addEventListener("click", async () => {
        genBtn.disabled = true;
        genBtn.textContent = "Fetching number...";
        try {
          const res = await fetch(`${API_BASE}/get-phone`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ shopeeId: orderSn, product: productName, productIndex: idx })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message);

          phoneNumberSpan.textContent = data.phoneNumber;
          phoneBox.classList.remove("hidden");
          provider = data.provider;
          providerOrderId = data.providerOrderId;

          startCountdown(300, changeBtn, timerEl);

          pollOtp(otpCode, requestOtpBtn, provider, providerOrderId);
        } catch (e) {
          alert("Failed to fetch number: " + e.message);
        } finally {
          genBtn.disabled = false;
          genBtn.textContent = "Generate Number";
        }
      });

      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(phoneNumberSpan.textContent);
        copyBtn.textContent = "Copied!";
        setTimeout(() => (copyBtn.textContent = "Copy"), 1500);
      });

      changeBtn.addEventListener("click", async () => {
        if (!providerOrderId) return;
        await fetch(`${API_BASE}/cancel-order`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ shopeeId: orderSn, provider, providerOrderId })
        });
        location.reload();
      });

      requestOtpBtn.addEventListener("click", async () => {
        if (!providerOrderId) return;
        await fetch(`${API_BASE}/request-another-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ shopeeId: orderSn, provider, providerOrderId })
        });
        otpCode.textContent = "Waiting for new OTP...";
      });
    }

    function startCountdown(seconds, btn, timerEl) {
      let remaining = seconds;
      btn.disabled = true;
      timerEl.textContent = `Change Number available in ${remaining}s`;

      const interval = setInterval(() => {
        remaining--;
        if (remaining > 0) {
          timerEl.textContent = `Change Number available in ${remaining}s`;
        } else {
          clearInterval(interval);
          btn.disabled = false;
          timerEl.textContent = "You can now change number.";
        }
      }, 1000);
    }

    async function pollOtp(otpEl, requestOtpBtn, provider, providerOrderId) {
      const interval = setInterval(async () => {
        try {
          const res = await fetch(`${API_BASE}/check-otp`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ shopeeId: orderSn, provider, providerOrderId })
          });
          const data = await res.json();
          if (data.otp) {
            otpEl.textContent = `OTP: ${data.otp}`;
            clearInterval(interval);
            requestOtpBtn.classList.remove("hidden");
          }
        } catch (e) {
          console.error("pollOtp error", e);
        }
      }, 5000);
    }
  </script>
</body>
</html>
