<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Your OTP - HavicBot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Language Switcher Button -->
    <div class="absolute top-4 right-4">
        <button id="lang-switcher" class="px-4 py-2 bg-white text-gray-700 font-semibold rounded-lg shadow-md hover:bg-gray-200 transition-colors duration-200">
            Bahasa Melayu
        </button>
    </div>

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 text-center">
        <h1 class="text-3xl font-bold text-gray-800 mb-2" data-translate="title">Your Redemption</h1>
        <p class="text-gray-500 mb-6" id="status-text" data-translate="status_requesting">Requesting a phone number for you...</p>

        <!-- Phone Number Display -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700" data-translate="phone_label">Generated Phone Number</label>
            <div class="flex items-center gap-2 mt-1">
                <div id="phone-number-box" class="flex-grow text-lg font-semibold bg-gray-100 p-3 rounded-lg text-gray-800">- - -</div>
                <button id="copy-phone-btn" class="p-3 bg-gray-200 hover:bg-gray-300 rounded-lg transition-colors hidden" data-translate-title="copy_button_title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
            </div>
        </div>

        <!-- OTP Display -->
        <div class="mb-2">
            <label class="block text-sm font-medium text-gray-700" data-translate="otp_label">Verification Code (OTP)</label>
            <div class="flex items-center gap-2 mt-1">
                <div id="otp-box" class="flex-grow text-2xl font-bold tracking-widest bg-gray-100 p-4 rounded-lg text-blue-600">- - -</div>
                <button id="copy-otp-btn" class="p-3 bg-gray-200 hover:bg-gray-300 rounded-lg transition-colors hidden" data-translate-title="copy_button_title">
                     <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
            </div>
        </div>

        <!-- Instructions for waiting -->
        <p class="text-xs text-gray-500 mb-6" data-translate="otp_instructions">
            Your code is being generated. Please stay on this page to ensure delivery. This usually takes 2-10 minutes.
        </p>

        <div id="error-message" class="mt-6 text-center text-sm font-medium p-4 rounded-lg bg-red-100 text-red-800 hidden"></div>
    </div>

    <script>
        const statusText = document.getElementById('status-text');
        const phoneNumberBox = document.getElementById('phone-number-box');
        const otpBox = document.getElementById('otp-box');
        const errorMessage = document.getElementById('error-message');
        const langSwitcher = document.getElementById('lang-switcher');
        const copyPhoneBtn = document.getElementById('copy-phone-btn');
        const copyOtpBtn = document.getElementById('copy-otp-btn');

        // --- Language Translation Setup ---
        const translations = {
            en: {
                title: 'Your Redemption',
                status_requesting: 'Requesting a phone number for you...',
                status_waiting: 'Waiting for SMS... This can take a minute.',
                status_success: 'Success! Your OTP has arrived.',
                status_failed: 'Redemption Failed',
                phone_label: 'Generated Phone Number',
                otp_label: 'Verification Code (OTP)',
                otp_instructions: 'Your code is being generated. Please stay on this page to ensure delivery. This usually takes 2-10 minutes.',
                lang_switcher_text: 'Bahasa Melayu',
                copy_button_title: 'Copy to clipboard',
                copied_message: 'Copied!'
            },
            ms: {
                title: 'Penebusan Anda',
                status_requesting: 'Memohon nombor telefon untuk anda...',
                status_waiting: 'Menunggu SMS... Ini mungkin mengambil masa seminit.',
                status_success: 'Berjaya! OTP anda telah tiba.',
                status_failed: 'Penebusan Gagal',
                phone_label: 'Nombor Telefon Dijana',
                otp_label: 'Kod Pengesahan (OTP)',
                otp_instructions: 'Kod anda sedang dijana. Sila kekal di halaman ini untuk memastikan penghantaran. Proses ini biasanya mengambil masa 2-10 minit.',
                lang_switcher_text: 'English',
                copy_button_title: 'Salin ke papan keratan',
                copied_message: 'Disalin!'
            }
        };
        
        let currentLang = 'en';

        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;

            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang][key]) el.innerHTML = translations[lang][key];
            });
            
            document.querySelectorAll('[data-translate-title]').forEach(el => {
                const key = el.getAttribute('data-translate-title');
                if (translations[lang][key]) el.title = translations[lang][key];
            });

            langSwitcher.textContent = translations[lang].lang_switcher_text;
        }

        langSwitcher.addEventListener('click', () => {
            const newLang = currentLang === 'en' ? 'ms' : 'en';
            setLanguage(newLang);
        });

        function T(key) {
            return translations[currentLang][key] || key;
        }

        // --- Copy to Clipboard Function ---
        function copyToClipboard(text, button) {
            const originalContent = button.innerHTML;
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                button.innerHTML = T('copied_message');
                button.classList.add('text-green-600');
            } catch (err) {
                console.error('Failed to copy text: ', err);
            }
            document.body.removeChild(textarea);

            setTimeout(() => {
                button.innerHTML = originalContent;
                button.classList.remove('text-green-600');
            }, 1500);
        }

        copyPhoneBtn.addEventListener('click', () => {
            if (phoneNumberBox.textContent !== '- - -') {
                copyToClipboard(phoneNumberBox.textContent, copyPhoneBtn);
            }
        });

        copyOtpBtn.addEventListener('click', () => {
            if (otpBox.textContent !== '- - -') {
                copyToClipboard(otpBox.textContent, copyOtpBtn);
            }
        });

        // --- Main Application Logic ---
        const backendUrl = 'https://havicbot-backend.onrender.com';

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        async function startRedemptionProcess() {
            const orderId = getQueryParam('orderId');
            if (!orderId) {
                statusText.textContent = "Error: No Order ID found.";
                return;
            }

            try {
                const phoneResponse = await fetch(`${backendUrl}/get-phone`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shopeeId: orderId })
                });

                const phoneResult = await phoneResponse.json();
                if (!phoneResponse.ok) throw new Error(phoneResult.message);

                const { phoneNumber, fiveSimOrderId } = phoneResult;
                phoneNumberBox.textContent = phoneNumber;
                copyPhoneBtn.classList.remove('hidden'); // Show copy button
                statusText.textContent = T('status_waiting');

                checkForOtp(fiveSimOrderId);

            } catch (error) {
                errorMessage.textContent = `Error: ${error.message}`;
                errorMessage.classList.remove('hidden');
                statusText.textContent = T('status_failed');
            }
        }

        async function checkForOtp(fiveSimOrderId) {
            const interval = setInterval(async () => {
                try {
                    const otpResponse = await fetch(`${backendUrl}/check-otp`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fiveSimOrderId: fiveSimOrderId })
                    });

                    const otpResult = await otpResponse.json();

                    if (otpResponse.ok && otpResult.otp) {
                        otpBox.textContent = otpResult.otp;
                        copyOtpBtn.classList.remove('hidden'); // Show copy button
                        statusText.textContent = T('status_success');
                        clearInterval(interval);
                    }

                } catch (error) {
                    console.error("Error checking for OTP:", error);
                }
            }, 5000);
        }

        window.onload = () => {
            setLanguage('en');
            startRedemptionProcess();
        };
    </script>

</body>
</html>
