<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 py-10">

    <main class="max-w-4xl mx-auto">
        <div id="order-container" class="bg-white rounded-lg shadow-lg p-8">
            <!-- Content will be injected by JavaScript -->
        </div>
        <div class="text-center mt-6">
            <a href="index.html" class="text-indigo-600 hover:text-indigo-800 font-medium">← Verify another order</a>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const orderContainer = document.getElementById('order-container');
            
            // Retrieve the data from sessionStorage
            const orderDataString = sessionStorage.getItem('shopeeOrderDetails');

            if (!orderDataString) {
                orderContainer.innerHTML = `
                    <div class="text-center">
                        <h2 class="text-xl font-bold text-red-600">No Order Data Found</h2>
                        <p class="text-gray-500 mt-2">Please go back and verify an order first.</p>
                    </div>
                `;
                return;
            }

            try {
                const orderData = JSON.parse(orderDataString);
                
                // --- Build the HTML to display the order details ---
                let itemsHtml = '';
                if (orderData.item_list && orderData.item_list.length > 0) {
                    orderData.item_list.forEach(item => {
                        itemsHtml += `
                            <li class="flex items-center py-4 px-2 border-b border-gray-200 last:border-b-0">
                                <div class="w-16 h-16 bg-gray-200 rounded-md flex-shrink-0 mr-4">
                                    <!-- You can display item.image_info.image_url if available -->
                                    <img src="${item.image_info?.image_url || 'https://placehold.co/64x64/e2e8f0/adb5bd?text=N/A'}" alt="${item.item_name}" class="w-full h-full object-cover rounded-md">
                                </div>
                                <div class="flex-grow">
                                    <h4 class="font-semibold text-gray-800">${item.item_name}</h4>
                                    <p class="text-sm text-gray-500">SKU: ${item.item_sku || 'N/A'}</p>
                                    ${item.model_name ? `<p class="text-sm text-gray-500">Variation: ${item.model_name}</p>` : ''}
                                </div>
                                <div class="text-right ml-4">
                                     <p class="text-sm text-gray-500">x ${item.model_quantity_purchased}</p>
                                </div>
                            </li>
                        `;
                    });
                } else {
                    itemsHtml = '<li class="text-center py-4 text-gray-500">No items found in this order.</li>';
                }

                orderContainer.innerHTML = `
                    <div class="pb-6 border-b border-gray-200">
                        <h1 class="text-2xl font-bold text-gray-800">Order Details</h1>
                        <p class="text-gray-600 mt-2">Order SN: <span class="font-mono bg-gray-100 p-1 rounded">${orderData.order_sn}</span></p>
                    </div>
                    <div class="mt-6">
                        <h3 class="text-lg font-semibold text-gray-700 mb-2">Items in this Order</h3>
                        <ul class="divide-y divide-gray-200">${itemsHtml}</ul>
                    </div>
                `;

            } catch (error) {
                console.error("Failed to parse order data:", error);
                orderContainer.innerHTML = `
                    <div class="text-center">
                        <h2 class="text-xl font-bold text-red-600">Error Displaying Order</h2>
                        <p class="text-gray-500 mt-2">The order data could not be read correctly.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
