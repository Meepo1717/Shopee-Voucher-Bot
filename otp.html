<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Voucher Redemption - HavicBot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bouncing-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        .bouncing-loader > div {
            width: 8px;
            height: 8px;
            margin: 3px;
            border-radius: 50%;
            background-color: #a0aec0; /* gray-400 */
            animation: bouncing-loader 0.6s infinite alternate;
        }
        .bouncing-loader > div:nth-child(2) {
            animation-delay: 0.2s;
        }
        .bouncing-loader > div:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes bouncing-loader {
            to {
                opacity: 0.3;
                transform: translateY(-6px);
            }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="absolute top-4 right-4">
        <button id="lang-switcher" class="px-4 py-2 bg-white text-gray-700 font-semibold rounded-lg shadow-md hover:bg-gray-200 transition-colors duration-200 text-sm">
            Bahasa Melayu
        </button>
    </div>

    <div class="w-full max-w-lg bg-white rounded-xl shadow-lg p-6">
        <div class="text-center">
            <h1 class="text-xl font-bold mb-2" style="color:#EE4D2D;" data-translate="title">Voucher Redemption</h1>
            <p class="text-blue-600 mb-4" id="status-text" data-translate="status_fetching">Fetching your order details...</p>
        </div>

        <div id="order-details-container" class="hidden text-left mb-4 border-b pb-4">
            <p class="text-xs text-gray-600" data-translate="order_sn_label">Order SN</p>
            <h2 id="order-sn-display" class="text-lg font-semibold text-gray-800"></h2>
        </div>

        <div id="products-container" class="space-y-4"></div>
    </div>

<script>
(() => {
    const backendUrl = "https://havicbot-backend.onrender.com";
    const MAIN_TIMER_DURATION = 10 * 60 * 1000;
    const CHANGE_NUMBER_DELAY = 5 * 60 * 1000;
    const REQUEST_OTP_MAX_ATTEMPTS = 1;

    const translations = {
        en: {
            title: "Voucher Redemption",
            status_fetching: "Fetching your order details...",
            status_ready: "Your products are ready. Please redeem them below.",
            status_failed_fetch: "Failed to fetch order details. Please check the Order ID and try again.",
            order_sn_label: "Order SN",
            redeem_button: "Redeem",
            redeeming_button: "Redeeming...",
            phone_label: "Generated Phone Number",
            otp_label: "Verification Code (OTP)",
            lang_button: "Bahasa Melayu",
            copy: "Copy",
            copied: "Copied!",
            get_new_number: "Get New Number",
            get_new_number_timed: (s) => `Get New Number (${s})`,
            get_new_number_blocked: "Blocked",
            request_new_otp: "Request New OTP",
            requesting_otp: "Requesting...",
            otp_requested: "Requested",
            voucher_redeemed_successfully: "Voucher Successfully Redeemed!",
            instruction_1: "Always verify using SMS.",
            instruction_2: "Stay on this page while the phone number and OTP are being generated.",
            instruction_3: "If the OTP is taking too long, please close the app, turn your phone's Airplane Mode on and off, then try again.",
            instruction_4: "Please be patient as this process can take a few minutes.",
        },
        ms: {
            title: "Penebusan Baucar",
            status_fetching: "Memuatkan butiran pesanan anda...",
            status_ready: "Produk anda sudah sedia. Sila tebus di bawah.",
            status_failed_fetch: "Gagal memuatkan butiran pesanan. Sila semak ID Pesanan dan cuba lagi.",
            order_sn_label: "SN Pesanan",
            redeem_button: "Tebus",
            redeeming_button: "Menebus...",
            phone_label: "Nombor Telefon Dijana",
            otp_label: "Kod Pengesahan (OTP)",
            lang_button: "English",
            copy: "Salin",
            copied: "Disalin!",
            get_new_number: "Dapatkan Nombor Baru",
            get_new_number_timed: (s) => `Dapatkan Nombor Baru (${s})`,
            get_new_number_blocked: "Disekat",
            request_new_otp: "Minta OTP Baru",
            requesting_otp: "Meminta...",
            otp_requested: "Diminta",
            voucher_redeemed_successfully: "Baucar Berjaya Ditebus!",
            instruction_1: "Sentiasa sahkan menggunakan SMS.",
            instruction_2: "Kekal di halaman ini semasa nombor telefon dan OTP dijana.",
            instruction_3: "Jika OTP mengambil masa terlalu lama, sila tutup aplikasi, hidupkan dan matikan Mod Pesawat telefon anda, kemudian cuba lagi.",
            instruction_4: "Sila bersabar kerana proses ini mungkin mengambil masa beberapa minit.",
        }
    };

    let currentLang = 'en';
    const activeTimers = {};

    function t(key, ...args) {
        const translation = translations[currentLang]?.[key] || translations.en[key];
        return typeof translation === 'function' ? translation(...args) : translation;
    }

    function setLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('[data-translate]').forEach(el => {
            const key = el.getAttribute('data-translate');
            el.textContent = t(key);
        });
        document.getElementById('lang-switcher').textContent = t('lang_button');
    }

    function getQS(name) { return new URLSearchParams(window.location.search).get(name); }
    function getOrderSn() { return getQS('order_sn'); }

    function loadOrderState(orderSn) {
        try {
            const state = JSON.parse(localStorage.getItem(`order_${orderSn}`));
            return state && typeof state === 'object' ? state : {};
        } catch (e) { return {}; }
    }

    function saveOrderState(orderSn, state) {
        localStorage.setItem(`order_${orderSn}`, JSON.stringify(state));
    }

    function ensureEntry(state, index) {
        state.items = state.items || [];
        if (!state.items[index]) state.items[index] = {};
        return state.items[index];
    }

    async function copyText(text, btn) {
        if (!text) return;
        try {
            await navigator.clipboard.writeText(text);
            const originalText = btn.textContent;
            btn.textContent = t('copied');
            btn.disabled = true;
            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
            }, 1500);
        } catch (err) { console.error('Failed to copy: ', err); }
    }

    function attachCopyHandlers(index) {
        document.getElementById(`copy-phone-btn-${index}`)?.addEventListener('click', e => copyText(document.getElementById(`phone-box-${index}`).textContent, e.target));
        document.getElementById(`copy-otp-btn-${index}`)?.addEventListener('click', e => copyText(document.getElementById(`otp-box-${index}`).textContent, e.target));
    }
    
    function formatTime(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
        const seconds = (totalSeconds % 60).toString().padStart(2, '0');
        return `${minutes}:${seconds}`;
    }
    
    function getFormattedDate() {
        const today = new Date();
        const day = today.getDate();
        const year = today.getFullYear();
        const month = today.toLocaleString('default', { month: 'short' });
        return `${day} ${month} ${year}`;
    }
    
    function showBouncingLoader(element) {
        if(element) {
            element.innerHTML = '<div class="bouncing-loader"><div></div><div></div><div></div></div>';
        }
    }

    function resetItemUI(index) {
        const orderSn = getOrderSn();
        const orderState = loadOrderState(orderSn);
        const stateEntry = ensureEntry(orderState, index);

        stateEntry.status = 'idle';
        stateEntry.phoneNumber = null;
        stateEntry.otp = null;
        stateEntry.countdownEnd = null;
        stateEntry.getNewNumberCount = 0;
        stateEntry.requestOtpCount = 0;
        stateEntry.getNewNumberAvailableTs = null; // Also clear the timer timestamp
        saveOrderState(orderSn, orderState);

        const uiContainer = document.getElementById(`redemption-ui-${index}`);
        const redeemBtn = document.getElementById(`redeem-btn-${index}`);
        if(uiContainer) uiContainer.classList.add('hidden');
        if(redeemBtn) redeemBtn.classList.remove('hidden');
    }

    function startItemTimer(index, countdownEnd) {
        const timerKey = `main_timer_${index}`;
        if (activeTimers[timerKey]) clearInterval(activeTimers[timerKey]);
        
        const timerEl = document.getElementById(`timer-${index}`);

        const update = () => {
            if (!timerEl) {
                clearInterval(activeTimers[timerKey]);
                return;
            }
            const remaining = countdownEnd - Date.now();
            if(remaining <= 0) {
                clearInterval(activeTimers[timerKey]);
                delete activeTimers[timerKey];
                timerEl.textContent = '';
                const requestOtpBtn = document.getElementById(`request-otp-btn-${index}`);
                if(requestOtpBtn) requestOtpBtn.disabled = false;
            } else {
                timerEl.textContent = `⏱️ ${formatTime(remaining)}`;
            }
        };
        update();
        activeTimers[timerKey] = setInterval(update, 1000);
    }

    function injectRedemptionUI(container, index) {
        const todayDate = getFormattedDate();
        container.innerHTML = `
            <div class="flex justify-end items-center mb-2"><div id="timer-${index}" class="text-sm font-semibold text-gray-700"></div></div>
            
            <div class="space-y-3 sm:space-y-0 sm:flex sm:space-x-2">
                <div class="sm:w-1/2">
                    <label class="block text-xs font-medium text-gray-500 mb-1" data-translate="phone_label">${t('phone_label')}</label>
                    <div class="flex items-center">
                        <div id="phone-box-${index}" class="w-full border rounded-l-lg px-3 py-2 bg-gray-100 text-center text-sm">...</div>
                        <button id="copy-phone-btn-${index}" class="px-3 py-2 bg-gray-200 text-gray-700 font-semibold rounded-r-lg hover:bg-gray-300 border border-l-0 text-sm" data-translate="copy">${t('copy')}</button>
                    </div>
                </div>
                <div class="sm:w-1/2">
                    <label class="block text-xs font-medium text-gray-500 mb-1" data-translate="otp_label">${t('otp_label')}</label>
                    <div class="flex items-center">
                        <div id="otp-box-${index}" class="w-full border rounded-l-lg px-3 py-2 bg-gray-100 text-center text-sm">...</div>
                        <button id="copy-otp-btn-${index}" class="px-3 py-2 bg-gray-200 text-gray-700 font-semibold rounded-r-lg hover:bg-gray-300 border border-l-0 text-sm" data-translate="copy">${t('copy')}</button>
                    </div>
                </div>
            </div>

            <div class="mt-3 space-y-2 sm:space-y-0 sm:flex sm:space-x-2">
                <button id="get-new-number-btn-${index}" class="w-full sm:w-1/2 px-4 py-2 bg-yellow-500 text-white font-semibold rounded-lg hover:bg-yellow-600 disabled:bg-gray-400 disabled:cursor-not-allowed transition text-sm"></button>
                <button id="request-otp-btn-${index}" class="w-full sm:w-1/2 px-4 py-2 bg-purple-600 text-white font-semibold rounded-lg hover:bg-purple-700 disabled:bg-gray-400 transition text-sm" disabled data-translate="request_new_otp">${t('request_new_otp')}</button>
            </div>

            <div class="mt-4 pt-4 border-t">
                <ul class="space-y-2 text-xs text-gray-500 list-decimal list-inside">
                    <li data-translate="instruction_1">${t('instruction_1')}</li>
                    <li data-translate="instruction_2">${t('instruction_2')}</li>
                    <li data-translate="instruction_3">${t('instruction_3')}</li>
                    <li data-translate="instruction_4">${t('instruction_4')}</li>
                </ul>

                <hr class="my-3 border-gray-200">
                <div class="text-xs text-gray-600">
                    <p class="font-medium text-gray-800 mb-2">Instructions to redeem vouchers:</p>
                    <div class="space-y-3">
                        <div>
                            <h4 class="font-semibold text-gray-900">☕ How to Claim ZUS Coffee Voucher</h4>
                            <ul class="list-disc list-inside mt-1 space-y-1 pl-2">
                                <li>📱 Register in the ZUS app using the generated phone number.</li>
                                <li>✅ Verify via SMS.</li>
                                <li>📧 Enter a dummy email (e.g. test123@gmail.com).</li>
                                <li>⚠️ Skip referral code.</li>
                                <li>🎟️ Go to My Account → My Vouchers → Active.</li>
                                <li>🔑 Enter code: BUY1FREE1 🎉</li>
                                <li>🎂 For Birthday, use today’s date (e.g. if today = ${todayDate}, put ${todayDate}).</li>
                                <li>👆 Enable Biometrics (fingerprint/face) to stay logged in.</li>
                            </ul>
                        </div>
                        <div>
                            <h4 class="font-semibold text-gray-900">🍗 How to Claim KFC Voucher</h4>
                            <ul class="list-disc list-inside mt-1 space-y-1 pl-2">
                                <li>📱 Sign up with the generated phone number.</li>
                                <li>✅ Verify via SMS.</li>
                                <li>📧 Enter a dummy email (e.g. test123@gmail.com).</li>
                                <li>🎂 For Birthday, use today’s date (e.g. if today = ${todayDate}, put ${todayDate}).</li>
                                <li>🎟️ Go to Promotions to claim vouchers.</li>
                            </ul>
                        </div>
                        <div>
                            <h4 class="font-semibold text-gray-900">🍔 How to Claim MarryBrown Voucher</h4>
                            <ul class="list-disc list-inside mt-1 space-y-1 pl-2">
                                <li>📱 Sign up with the generated phone number.</li>
                                <li>✅ Verify via SMS.</li>
                                <li>📧 Enter a dummy email (e.g. test123@gmail.com).</li>
                                <li>🎂 For Birthday, use today’s date (e.g. if today = ${todayDate}, put ${todayDate}).</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        `;
        attachCopyHandlers(index);
    }
    
    function updateRequestOtpButton(index, stateEntry) {
        const btn = document.getElementById(`request-otp-btn-${index}`);
        if (!btn) return;
        
        const count = stateEntry.requestOtpCount || 0;
        if (count >= REQUEST_OTP_MAX_ATTEMPTS) {
            btn.disabled = true;
            btn.textContent = t('otp_requested');
        } else {
            btn.disabled = false;
            btn.textContent = t('request_new_otp');
        }
    }

    function setFinalRedeemedUI(index, stateEntry) {
        const getNewNumberTimerKey = `get_new_number_${index}`;
        if (activeTimers[getNewNumberTimerKey]) {
            clearInterval(activeTimers[getNewNumberTimerKey]);
            delete activeTimers[getNewNumberTimerKey];
        }

        const timerKey = `main_timer_${index}`;
        if (activeTimers[timerKey]) {
            clearInterval(activeTimers[timerKey]);
            delete activeTimers[timerKey];
        }
        const timerEl = document.getElementById(`timer-${index}`);
        if (timerEl) timerEl.innerHTML = `
            <div class="text-center"><span class="text-green-600 font-bold text-sm">${t('voucher_redeemed_successfully')}</span></div>`;

        const getNewNumberBtn = document.getElementById(`get-new-number-btn-${index}`);
        if(getNewNumberBtn) {
            getNewNumberBtn.disabled = true;
            getNewNumberBtn.textContent = t('get_new_number_blocked');
        }
        
        updateRequestOtpButton(index, stateEntry);
    }

    async function pollForOtp(orderSn, index, pollingInterval) {
        const orderState = loadOrderState(orderSn);
        const stateEntry = ensureEntry(orderState, index);

        if (stateEntry.countdownEnd && Date.now() > stateEntry.countdownEnd) {
            clearInterval(pollingInterval);
            return;
        }

        try {
            const res = await fetch(`${backendUrl}/check-otp`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ shopeeId: orderSn, provider: stateEntry.provider, providerOrderId: stateEntry.providerOrderId })
            });
            const data = await res.json();

            if (data.otp) {
                clearInterval(pollingInterval);
                stateEntry.otp = data.otp;
                stateEntry.status = 'redeemed';
                stateEntry.otpReceived = true;
                saveOrderState(orderSn, orderState);
                
                document.getElementById(`otp-box-${index}`).textContent = data.otp;
                setFinalRedeemedUI(index, stateEntry);
            }
        } catch (error) { console.error("OTP Poll Error:", error); }
    }

    async function requestAndFetchPhoneNumber(orderSn, item, index) {
        const orderState = loadOrderState(orderSn);
        const stateEntry = ensureEntry(orderState, index);
        if (stateEntry.otpReceived) return;

        stateEntry.getNewNumberCount = (stateEntry.getNewNumberCount || 0) + 1;
        stateEntry.getNewNumberAvailableTs = Date.now() + CHANGE_NUMBER_DELAY;
        saveOrderState(orderSn, orderState);

        manageGetNewNumberButton(index, stateEntry);
        
        const phoneBox = document.getElementById(`phone-box-${index}`);
        const otpBox = document.getElementById(`otp-box-${index}`);
        phoneBox.textContent = t('redeeming_button');
        showBouncingLoader(otpBox);
        
        const requestOtpBtn = document.getElementById(`request-otp-btn-${index}`);
        requestOtpBtn.disabled = true;
        requestOtpBtn.textContent = t('request_new_otp');

        try {
            const res = await fetch(`${backendUrl}/get-phone`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ shopeeId: orderSn, product: item.name, productIndex: index, isRetry: true })
            });
            const data = await res.json();
            if (!res.ok || !data.phoneNumber) throw new Error(data.message || 'Failed to get number.');

            stateEntry.status = 'pending';
            stateEntry.phoneNumber = data.phoneNumber;
            stateEntry.provider = data.provider;
            stateEntry.providerOrderId = data.providerOrderId;
            stateEntry.otpReceived = false;
            stateEntry.requestOtpCount = 0;
            saveOrderState(orderSn, orderState);

            phoneBox.textContent = data.phoneNumber;
            const pollingInterval = setInterval(() => pollForOtp(orderSn, index, pollingInterval), 5000);
        } catch (error) {
            console.error("Fetch Phone Error:", error);
            resetItemUI(index);
        }
    }
        
    async function requestAnotherOtp(orderSn, index) {
        const btn = document.getElementById(`request-otp-btn-${index}`);
        btn.textContent = t('requesting_otp');
        btn.disabled = true;

        const orderState = loadOrderState(orderSn);
        const stateEntry = ensureEntry(orderState, index);
        stateEntry.requestOtpCount = (stateEntry.requestOtpCount || 0) + 1;
        saveOrderState(orderSn, orderState);
        
        const otpBox = document.getElementById(`otp-box-${index}`);
        showBouncingLoader(otpBox);

        try {
            await fetch(`${backendUrl}/request-another-otp`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ shopeeId: orderSn, provider: stateEntry.provider, providerOrderId: stateEntry.providerOrderId })
            });
            const pollingInterval = setInterval(() => pollForOtp(orderSn, index, pollingInterval), 5000);
        } catch(e) {
            console.error("Request New OTP Error:", e);
            otpBox.textContent = '...';
        } finally {
            updateRequestOtpButton(index, stateEntry);
        }
    }
        
    function manageGetNewNumberButton(index, stateEntry) {
        const btn = document.getElementById(`get-new-number-btn-${index}`);
        if (!btn) return;
        const timerKey = `get_new_number_${index}`;

        if (activeTimers[timerKey]) clearInterval(activeTimers[timerKey]);

        if (stateEntry.otpReceived) {
            btn.disabled = true;
            btn.textContent = t('get_new_number_blocked');
            return;
        }
        
        const updateButton = () => {
            const changeNumberCooldownPassed = Date.now() >= (stateEntry.getNewNumberAvailableTs || 0);

            if (changeNumberCooldownPassed) {
                btn.disabled = false;
                btn.textContent = t('get_new_number');
                if (activeTimers[timerKey]) {
                    clearInterval(activeTimers[timerKey]);
                    delete activeTimers[timerKey];
                }
            } else {
                const remaining = stateEntry.getNewNumberAvailableTs - Date.now();
                btn.disabled = true;
                btn.textContent = t('get_new_number_timed', formatTime(remaining));
            }
        };
        updateButton();
        activeTimers[timerKey] = setInterval(updateButton, 1000);
    }

    function startRedemptionProcess(orderSn, item, index, redeemBtn) {
        const orderState = loadOrderState(orderSn);
        const stateEntry = ensureEntry(orderState, index);
        
        redeemBtn.classList.add('hidden');
        const uiContainer = document.getElementById(`redemption-ui-${index}`);
        uiContainer.classList.remove('hidden');
        injectRedemptionUI(uiContainer, index);

        stateEntry.status = 'pending';
        stateEntry.countdownEnd = Date.now() + MAIN_TIMER_DURATION;
        stateEntry.getNewNumberCount = 0;
        stateEntry.otpReceived = false;
        stateEntry.requestOtpCount = 0;
        saveOrderState(orderSn, orderState);

        startItemTimer(index, stateEntry.countdownEnd);

        document.getElementById(`get-new-number-btn-${index}`).onclick = () => requestAndFetchPhoneNumber(orderSn, item, index);
        document.getElementById(`request-otp-btn-${index}`).onclick = () => requestAnotherOtp(orderSn, index);
        
        requestAndFetchPhoneNumber(orderSn, item, index);
    }
    
    function restoreVoucherUI(orderSn, index, stateEntry, redeemBtn) {
        if (!stateEntry || !stateEntry.status || stateEntry.status === 'idle') return;

        if (stateEntry.countdownEnd && Date.now() >= stateEntry.countdownEnd) {
            resetItemUI(index);
            return;
        }

        if(redeemBtn) redeemBtn.classList.add('hidden');
        const uiContainer = document.getElementById(`redemption-ui-${index}`);
        if (uiContainer) uiContainer.classList.remove('hidden');
        injectRedemptionUI(uiContainer, index);
        
        if (stateEntry.countdownEnd) {
            startItemTimer(index, stateEntry.countdownEnd);
        }

        const itemData = JSON.parse(redeemBtn.dataset.item);
        document.getElementById(`get-new-number-btn-${index}`).onclick = () => requestAndFetchPhoneNumber(orderSn, itemData, index);
        document.getElementById(`request-otp-btn-${index}`).onclick = () => requestAnotherOtp(orderSn, index);
        
        if (stateEntry.status === 'redeemed') {
            setFinalRedeemedUI(index, stateEntry);
        }

        if (stateEntry.phoneNumber) {
            document.getElementById(`phone-box-${index}`).textContent = stateEntry.phoneNumber;
        }
        
        manageGetNewNumberButton(index, stateEntry);
        
        if (stateEntry.otpReceived) {
            updateRequestOtpButton(index, stateEntry);
            if (stateEntry.otp) {
                document.getElementById(`otp-box-${index}`).textContent = stateEntry.otp;
            }
        } else if (stateEntry.status === 'pending') {
            if (stateEntry.phoneNumber) {
                showBouncingLoader(document.getElementById(`otp-box-${index}`));
                const pollingInterval = setInterval(() => pollForOtp(orderSn, index, pollingInterval), 5000);
            } else {
                requestAndFetchPhoneNumber(orderSn, itemData, index);
            }
        }
    }

    async function boot() {
        document.getElementById('lang-switcher').addEventListener('click', () => setLanguage(currentLang === 'en' ? 'ms' : 'en'));
        setLanguage('en');

        const statusText = document.getElementById('status-text');
        const orderSn = getOrderSn();

        if (!orderSn) {
            statusText.textContent = "No Order ID found in URL.";
            return;
        }

        document.getElementById('order-sn-display').textContent = orderSn;
        document.getElementById('order-details-container').classList.remove('hidden');

        try {
            const res = await fetch(`${backendUrl}/get-order-details`, {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ shopeeId: orderSn })
            });

            if (!res.ok) throw new Error(`Server Error: ${res.status}`);
            const data = await res.json();
            if (!data.success || !data.items || data.items.length === 0) throw new Error(data.message || "No items found.");
            
            if (data.isReadOnly) {
                document.getElementById('lang-switcher').classList.add('hidden');
                statusText.textContent = "Viewing your completed redemption.";
                statusText.className = 'text-gray-600 mb-4';
                const productsContainer = document.getElementById('products-container');
                productsContainer.innerHTML = '';
                data.items.forEach(item => {
                    const itemCard = document.createElement('div');
                    itemCard.className = 'p-4 border rounded-lg bg-gray-50';
                    itemCard.innerHTML = `<h3 class="text-sm font-semibold text-gray-800">${item.name}</h3><div class="mt-3 space-y-2 text-xs"><p><strong>Phone:</strong> <span class="font-mono text-gray-700">${item.phoneNumber}</span></p><p><strong>OTP Code:</strong> <span class="font-mono text-gray-700">${item.otp}</span></p></div>`;
                    productsContainer.appendChild(itemCard);
                });
            } else {
                statusText.textContent = t('status_ready');
                statusText.className = 'text-green-600 mb-4';
                const productsContainer = document.getElementById('products-container');
                productsContainer.innerHTML = '';

                // FIX: Merge backend state with local state instead of overwriting
                const localState = loadOrderState(orderSn);
                data.items.forEach((backendItem, index) => {
                    const localItem = ensureEntry(localState, index);
                    // Backend data is the source of truth for status, but we preserve local UI state like timers
                    const mergedItem = { ...localItem, ...backendItem };
                    localState.items[index] = mergedItem;
                });
                saveOrderState(orderSn, localState);

                localState.items.forEach((item, index) => {
                    const productCard = document.createElement('div');
                    productCard.className = 'p-4 border rounded-lg bg-gray-50';
                    
                    productCard.innerHTML = `
                        <div class="flex justify-between items-center">
                            <h3 class="text-sm font-semibold text-gray-800">${item.name}</h3>
                            <button id="redeem-btn-${index}" class="px-5 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition w-28 text-sm" data-item='${JSON.stringify(item)}'>
                                ${t('redeem_button')}
                            </button>
                        </div>
                        <div id="redemption-ui-${index}" class="mt-4 pt-4 border-t border-gray-200 hidden"></div>
                    `;
                    productsContainer.appendChild(productCard);

                    const redeemBtn = document.getElementById(`redeem-btn-${index}`);
                    const stateEntry = item; // Use the merged item state

                    if (item.status === 'idle') {
                        redeemBtn.addEventListener('click', () => startRedemptionProcess(orderSn, item, index, redeemBtn));
                    } else {
                        restoreVoucherUI(orderSn, index, stateEntry, redeemBtn);
                    }
                });
            }

        } catch (error) {
            console.error("Boot Error:", error);
            statusText.textContent = `❌ ${t('status_failed_fetch')} (${error.message})`;
            statusText.className = 'text-red-600 mb-4';
        }
    }

    window.addEventListener('load', boot);

})();
</script>
</body>
</html>
