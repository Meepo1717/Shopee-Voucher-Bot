<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voucher Redemption - HavicBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {font-family:'Inter',sans-serif}
    .blink { animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.4; } }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <!-- Language Buttons -->
  <div class="absolute top-4 right-4 flex gap-2">
    <button id="btn-en"
            class="px-4 py-2 bg-white text-gray-700 font-semibold rounded-lg shadow-md hover:bg-gray-200 transition-colors">
      EN
    </button>
    <button id="btn-ms"
            class="px-4 py-2 bg-white text-gray-700 font-semibold rounded-lg shadow-md hover:bg-gray-200 transition-colors">
      MY
    </button>
  </div>

  <!-- Card -->
  <div class="w-full max-w-xl bg-white rounded-xl shadow-lg p-8">
    <div class="text-center">
      <h1 class="text-3xl font-bold mb-2" style="color:#EE4D2D;">Voucher Redemption</h1>
      <p class="text-blue-600 mb-6" id="status-text">Fetching your order details...</p>
    </div>

    <div id="order-details-container" class="hidden text-left mb-4 border-b pb-4">
      <p class="text-sm text-gray-600">Order ID</p>
      <h2 id="order-sn-display" class="text-xl font-semibold text-gray-800"></h2>
    </div>

    <div id="products-container" class="space-y-4"></div>
  </div>

<script>
(() => {
  const backendUrl = "https://havicbot-backend.onrender.com";

  // Translations
  const translations = {
    en: { waiting: "Waiting for OTP...", timeout: "OTP not received in time.", change: "Change Number", phone: "Generated Phone Number", otp: "Verification Code (OTP)" },
    ms: { waiting: "Menunggu OTP...", timeout: "OTP tidak diterima dalam masa.", change: "Tukar Nombor", phone: "Nombor Telefon Dijana", otp: "Kod Pengesahan (OTP)" }
  };
  let currentLang = 'en';
  function t(k){ return translations[currentLang][k] || k; }

  // Poll for OTP with reset logic
  function pollForOtp(orderSn, state, index){
    const otpBox  = document.getElementById(`otp-box-${index}`);
    const retryBtn = document.getElementById(`retry-btn-${index}`);
    let pollIv;

    const updateWaiting = (remain) => {
      const mm = Math.floor(remain/60000);
      const ss = ('0'+Math.floor((remain%60000)/1000)).slice(-2);
      otpBox.innerHTML = `<span class="blink">${t('waiting')}</span> (${mm}:${ss})`;
    };

    otpBox.innerHTML = `<span class="blink">${t('waiting')}</span> (10:00)`;
    retryBtn.disabled = true;
    retryBtn.classList.add('opacity-60','cursor-not-allowed');

    const startTs = Date.now();
    const poll = async () => {
      const remain = state.countdownEnd ? state.countdownEnd - Date.now() : 0;

      // Unlock Change Number after 5 mins
      if (Date.now() - startTs >= 5*60*1000) {
        retryBtn.disabled = false;
        retryBtn.classList.remove('opacity-60','cursor-not-allowed');
      }

      // Timeout after 10 mins
      if (remain <= 0) {
        if (pollIv) clearInterval(pollIv);
        otpBox.textContent = t('timeout');
        return;
      }

      updateWaiting(remain);

      try {
        const res = await fetch(`${backendUrl}/check-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ shopeeId: orderSn, provider: state.provider, providerOrderId: state.providerOrderId })
        });
        const data = await res.json().catch(()=>({}));
        if (res.ok && data.otp) {
          otpBox.textContent = data.otp;
          if (pollIv) clearInterval(pollIv);
        }
      } catch (_) {}
    };
    pollIv = setInterval(poll, 1000);
    poll();

    // Handle "Change Number"
    retryBtn.onclick = async () => {
      retryBtn.disabled = true;
      retryBtn.classList.add('opacity-60','cursor-not-allowed');
      otpBox.textContent = "Fetching new number...";

      try {
        const res = await fetch(`${backendUrl}/get-phone`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ shopeeId: orderSn, product: state.productKey, isRetry: true })
        });
        const data = await res.json().catch(()=>({}));
        if (!res.ok) throw new Error(data.message || "error");

        // Reset state with new number
        document.getElementById(`phone-box-${index}`).textContent = data.phoneNumber;
        state.phoneNumber = data.phoneNumber;
        state.provider = data.provider;
        state.providerOrderId = data.providerOrderId;
        state.countdownEnd = Date.now() + 10*60*1000; // reset 10 min countdown

        // Restart OTP polling
        if (pollIv) clearInterval(pollIv);
        pollForOtp(orderSn, state, index);
      } catch (e) {
        otpBox.textContent = "Error: Could not fetch new number.";
      }
    };
  }

  // Inject UI
  function injectRedemptionUI(container, index){
    container.innerHTML = `
      <div class="mb-4 text-left">
        <label class="block text-sm font-medium text-gray-700">${t('phone')}</label>
        <div class="flex items-center gap-2 mt-1">
          <div id="phone-box-${index}" class="flex-grow text-sm font-semibold bg-gray-50 border p-3 h-12 flex items-center justify-center rounded-lg text-gray-900 text-center"></div>
          <button id="copy-phone-${index}" disabled class="px-3 py-2 text-sm bg-gray-200 rounded-lg transition opacity-50 cursor-not-allowed">Copy</button>
        </div>
      </div>

      <div class="mb-2 text-left">
        <label class="block text-sm font-medium text-gray-700">${t('otp')}</label>
        <div class="flex items-center gap-2 mt-1">
          <div id="otp-box-${index}" class="flex-grow text-sm font-semibold bg-gray-50 border p-3 h-12 flex items-center justify-center rounded-lg text-blue-600 text-center"></div>
          <button id="copy-otp-${index}" disabled class="px-3 py-2 text-sm bg-gray-200 rounded-lg transition opacity-50 cursor-not-allowed">Copy</button>
        </div>
      </div>

      <div class="mt-4 text-center">
        <button id="retry-btn-${index}" disabled class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition opacity-60 cursor-not-allowed">
          ${t('change')}
        </button>
      </div>
    `;
  }

  // Language switch
  window.addEventListener('load', () => {
    document.getElementById("btn-en").addEventListener("click", ()=>{ currentLang="en"; });
    document.getElementById("btn-ms").addEventListener("click", ()=>{ currentLang="ms"; });
  });
})();
</script>
</body>
</html>
